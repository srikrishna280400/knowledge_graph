<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cognitive Map90 (3D)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050814;
        overflow: hidden;
      }
      #g {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 10;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.25);
        color: #e5e7eb;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        max-width: 460px;
      }
      #hud b {
        font-weight: 700;
      }
      #err {
        color: #fecaca;
        margin-top: 6px;
        white-space: pre-wrap;
      }
      label {
        user-select: none;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/3d-force-graph"></script>
  </head>

  <body>
    <div id="hud">
      <b>Map90 (3D)</b>
      <div id="stats" style="margin-top: 6px">Loading…</div>

      <div style="margin-top: 6px">
        <label>
          <input id="bridges" type="checkbox" />
          Show related bridges (network mode)
        </label>
      </div>

      <div style="margin-top: 6px; opacity: 0.85">
        Drag: rotate • Wheel: zoom • Right-drag: pan • Click node: focus
      </div>

      <div id="err"></div>
    </div>

    <div id="g"></div>

    <script>
      (async function () {
        const statsEl = document.getElementById("stats");
        const errEl = document.getElementById("err");

        try {
          // Load JSON safely (avoid "Unexpected token <" when 404 happens)
          const url = "./graph90.json";
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
          const g = await res.json();

          // Convert your graph90.json to 3d-force-graph format:
          // nodes need "id"; links use "source"/"target" by default.
          const nodes = g.nodes.map((n) => ({
            ...n,
            id: n.key,
            name: n.label || n.key,
            val: n.size || 1,
          }));

          const allLinks = g.edges.map((e) => ({
            ...e,
            source: e.source,
            target: e.target,
          }));

          // For a clean DAG/tree view, remove "related" edges (they can create cycles).
          const treeLinks = g.edges
            .filter((e) => (e.edge_type || e.label || "") !== "related")
            .map((e) => ({ ...e, source: e.source, target: e.target }));

          statsEl.textContent = `Nodes: ${nodes.length} | Links(tree): ${treeLinks.length} | Links(all): ${allLinks.length}`;

          const Graph = ForceGraph3D()(document.getElementById("g"))
            .backgroundColor("#050814")
            .graphData({ nodes, links: treeLinks })

            // Layout
            .dagMode("td")
            .dagLevelDistance(28)
            .onDagError((loop) =>
              console.warn("DAG cycle detected (best-effort layout):", loop)
            )

            // Nodes: bigger + brighter
            .nodeColor((n) => n.color || "#00e5ff")
            .nodeVal((n) => (n.val || 1) * 3.2) // increase to 4–6 if you want even larger
            .nodeOpacity(1)
            .nodeLabel((n) => `${n.name}${n.kind ? "\n" + n.kind : ""}`)

            // Links: thicker + brighter
            .linkColor((l) => l.color || "rgba(0,229,255,0.55)")
            .linkWidth((l) => (l.size || 1) * 2)
            .linkOpacity(0.75)

            // Extra punch: moving particles along links
            .linkDirectionalParticles(2)
            .linkDirectionalParticleWidth(2)
            .linkDirectionalParticleSpeed(0.01)
            .linkDirectionalParticleColor(() => "rgba(255,255,255,0.85)")

            // Click-to-focus camera
            .onNodeClick((node) => {
              const distance = 120;
              const distRatio =
                1 + distance / Math.hypot(node.x, node.y, node.z);
              Graph.cameraPosition(
                {
                  x: node.x * distRatio,
                  y: node.y * distRatio,
                  z: node.z * distRatio,
                },
                node,
                800
              );
            });

          const HOME_CAM = { x: 0, y: 40, z: 220 };

          Graph.onBackgroundClick(() => {
            Graph.cameraPosition(HOME_CAM, null, 800);
          });

          // Toggle: tree (DAG) <-> full network (with related bridges)
          document
            .getElementById("bridges")
            .addEventListener("change", (ev) => {
              const show = ev.target.checked;

              if (show) {
                Graph.dagMode(null); // disable DAG constraints for general graphs
                Graph.graphData({ nodes, links: allLinks });
                Graph.d3ReheatSimulation();
                statsEl.textContent = `Nodes: ${nodes.length} | Network links: ${allLinks.length}`;
              } else {
                Graph.graphData({ nodes, links: treeLinks });
                Graph.dagMode("td").dagLevelDistance(28);
                Graph.d3ReheatSimulation();
                statsEl.textContent = `Nodes: ${nodes.length} | Links(tree): ${treeLinks.length} | Links(all): ${allLinks.length}`;
              }
            });

          // Initial camera
          Graph.cameraPosition({ x: 0, y: 40, z: 220 });
        } catch (e) {
          console.error(e);
          errEl.textContent = String(e && e.stack ? e.stack : e);
          statsEl.textContent = "Failed to render";
        }
      })();
    </script>
  </body>
</html>
